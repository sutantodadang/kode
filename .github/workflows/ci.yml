name: ci

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Real-engine gate: downloads the pinned zindeks asset (checksum-verified)
  # and runs the combined native-engine tests that are `#[ignore]` by default.
  native-engines:
    name: native engines (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            asset: zindeks-ffi-linux-x86_64.tar.gz
            sha: 4a622c9eb3c1bceb342a4dfae94eaac6555ff0c019dd3a449b9c8a4ffe9360bf
            lib: libzindeks.so
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            asset: zindeks-ffi-linux-aarch64.tar.gz
            sha: 631689363a4193e2f589b859e9e9f383e5317df7833cd0a9cce83cf736489463
            lib: libzindeks.so
          - name: windows-x86_64
            os: windows-latest
            asset: zindeks-ffi-windows-x86_64.tar.gz
            sha: 55f272353de5c4b216173711a5c506549cbf6fb635dc37b2882fdde379dc6bbe
            lib: zindeks.dll
          - name: macos-aarch64
            os: macos-latest
            asset: zindeks-ffi-macos-aarch64.tar.gz
            sha: 506542cdc0b714dbc77fb4fdab3058ba637266733dbd094f392e0804535f5226
            lib: libzindeks.dylib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download and verify pinned zindeks asset
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          SHA: ${{ matrix.sha }}
          LIB: ${{ matrix.lib }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then tmp=$(cygpath -u "$RUNNER_TEMP"); fi
          mkdir -p "$tmp/zindeks"
          url="https://github.com/sutantodadang/zindeks/releases/download/v0.10.4/${ASSET}"
          curl -fsSL "$url" -o "$tmp/zindeks/${ASSET}"
          echo "${SHA}  $tmp/zindeks/${ASSET}" | sha256sum -c -
          tar -xzf "$tmp/zindeks/${ASSET}" -C "$tmp/zindeks"
          lib=$(find "$tmp/zindeks" -name "$LIB" | head -n1)
          if command -v cygpath >/dev/null 2>&1; then lib=$(cygpath -w "$lib"); fi
          echo "KODE_ZINDEKS_DYLIB=$lib" >> "$GITHUB_ENV"

      - name: Embedded zindeks real-engine gate
        run: cargo test -p kode-intel --test embedded_real -- --ignored

      - name: Combined native-engine gate
        run: cargo test -p kode --test native_engines -- --ignored

      - name: Fresh native install CLI gate
        env:
          KODE_SETUP_QA_HOME: ${{ runner.temp }}
        run: cargo test -p kode --test setup_real -- --ignored
