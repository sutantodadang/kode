name: ci

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Real-engine gate: downloads the pinned zindeks asset (checksum-verified)
  # and runs the combined native-engine tests that are `#[ignore]` by default.
  # Only linux-x86_64 is automated here; the Windows/macOS assets are the same
  # published artifacts and remain a manual release gate.
  native-engines:
    name: native engines (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download and verify pinned zindeks asset
        env:
          ASSET: zindeks-ffi-linux-x86_64.tar.gz
          SHA: 0fe903a78dc0a3bba0c3401df3b73a50f9c15e190c2154194b923ab84d31246b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zindeks"
          url="https://github.com/sutantodadang/zindeks/releases/download/v0.10.1/${ASSET}"
          curl -fsSL "$url" -o "$RUNNER_TEMP/zindeks/${ASSET}"
          echo "${SHA}  $RUNNER_TEMP/zindeks/${ASSET}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zindeks/${ASSET}" -C "$RUNNER_TEMP/zindeks"
          lib=$(find "$RUNNER_TEMP/zindeks" -name libzindeks.so | head -n1)
          echo "KODE_ZINDEKS_DYLIB=${lib}" >> "$GITHUB_ENV"

      - name: Embedded zindeks real-engine gate
        run: cargo test -p kode-intel --test embedded_real -- --ignored

      - name: Combined native-engine gate
        run: cargo test -p kode --test native_engines -- --ignored
