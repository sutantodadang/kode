name: ci

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Real-engine gate: downloads the pinned zindeks asset (checksum-verified)
  # and runs the combined native-engine tests that are `#[ignore]` by default.
  #
  # Runs on Windows x86_64 against the released asset. The Linux assets are
  # currently musl-linked (DT_NEEDED libc.so) and fail to dlopen on glibc
  # runners; that is fixed upstream and will move this gate to a Linux/Windows
  # matrix once a gnu-ABI asset is published. macOS remains a manual gate.
  native-engines:
    name: native engines (windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download and verify pinned zindeks asset
        shell: bash
        env:
          ASSET: zindeks-ffi-windows-x86_64.tar.gz
          SHA: 551ef2c2cb03a70ca367de912ac8a72ebc101a4d3a2d93cbd9b690f0ddd23b7c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zindeks"
          url="https://github.com/sutantodadang/zindeks/releases/download/v0.10.1/${ASSET}"
          curl -fsSL "$url" -o "$RUNNER_TEMP/zindeks/${ASSET}"
          echo "${SHA}  $RUNNER_TEMP/zindeks/${ASSET}" | sha256sum -c -
          tar --force-local -xzf "$RUNNER_TEMP/zindeks/${ASSET}" -C "$RUNNER_TEMP/zindeks"
          lib=$(find "$RUNNER_TEMP/zindeks" -name zindeks.dll | head -n1)
          echo "KODE_ZINDEKS_DYLIB=${lib}" >> "$GITHUB_ENV"

      - name: Embedded zindeks real-engine gate
        run: cargo test -p kode-intel --test embedded_real -- --ignored

      - name: Combined native-engine gate
        run: cargo test -p kode --test native_engines -- --ignored
