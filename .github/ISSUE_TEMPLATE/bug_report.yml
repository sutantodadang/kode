name: Bug report
description: Something in Kode does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security issues must not be filed here: see SECURITY.md.
        Please remove any API keys, tokens, or private code from logs before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cd into a repo with ...
        2. run `kode exec "..."`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kode version
      description: Output of `kode --version`.
      placeholder: kode 0.5.6
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux x86_64
        - Linux arm64
        - macOS (Apple Silicon)
        - Windows x86_64
        - Other
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: codex / gpt-5.6-sol
  - type: textarea
    id: doctor
    attributes:
      label: "`kode doctor` output"
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Re-run with `-vv` and paste the relevant part.
      render: text
